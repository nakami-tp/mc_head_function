plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mc_head_function" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

test {
	useJUnitPlatform()
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mc_head_function_test"
		eula = true
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

// Isolated, real-client regression scene; never included in the release JAR.
sourceSets {
	clientValidation {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
	}
}
loom {
	mods { head_client_validation { sourceSet sourceSets.clientValidation } }
	runs {
		clientValidation {
			client()
			source sourceSets.clientValidation
			runDir 'build/client-validation'
		}
	}
}
tasks.named('runClientValidation').configure {
	doFirst { delete 'build/client-validation/result.txt', 'build/client-validation/screenshots' }
	doLast {
		def result = file('build/client-validation/result.txt')
		if (!result.exists() || !result.text.startsWith('PASS ')) {
			throw new GradleException('Client validation failed; see build/client-validation/result.txt and logs.')
		}
	}
}

