	doFirst { delete 'build/furnace-validation/result.txt', 'build/furnace-validation/screenshots' }
	doLast {
		def result = file('build/furnace-validation/result.txt')
		if (!result.exists() || !result.text.startsWith('PASS ')) {
			throw new GradleException('Furnace overflow validation failed; see build/furnace-validation/result.txt and logs.')
		}
		def visual = providers.exec {
			workingDir rootDir
			commandLine 'python3', 'scripts/testing/check-furnace-overflow.py', 'build/furnace-validation/screenshots'
		}
		logger.lifecycle(visual.standardOutput.asText.get())
		logger.lifecycle(visual.standardError.asText.get())
		visual.result.get().assertNormalExitValue()
	}
}

