// Keep this run separate from other ongoing validation work.
allprojects {
    layout.buildDirectory.set(file('build/enderman-isolated'))
    afterEvaluate {
        tasks.named('processGametestResources').configure {
            doLast {
                def manifest = file("${destinationDir}/fabric.mod.json")
                def data = new groovy.json.JsonSlurper().parse(manifest)
                data.entrypoints['fabric-gametest'] = ['com.nakami.mcheadfunction.EndermanGameplayTest']
                manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
            }
        }
    }
}
allprojects {
    afterEvaluate {
        sourceSets {
            endermanValidation {
                compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
                runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
            }
        }
        loom {
            mods { enderman_client_validation { sourceSet sourceSets.endermanValidation } }
            runs {
                endermanValidation {
                    client()
                    source sourceSets.endermanValidation
                    runDir 'build/enderman-client-validation'
                }
            }
        }
        tasks.named('runEndermanValidation').configure {
            doFirst { project.delete project.file('build/enderman-client-validation/result.txt'), project.file('build/enderman-client-validation/screenshots') }
            doLast {
                def result = project.file('build/enderman-client-validation/result.txt')
                if (!result.exists() || !result.text.startsWith('PASS ')) {
                    throw new GradleException('Enderman client validation failed; see result.txt and logs.')
                }
            }
        }
    }
}
