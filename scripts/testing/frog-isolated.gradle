// Keep frog regression outputs independent of concurrent work in the shared workspace.
allprojects {
    layout.buildDirectory.set(file('build/frog-isolated'))
    afterEvaluate {
        tasks.named('processGametestResources').configure {
            doLast {
                def manifest = file("${destinationDir}/fabric.mod.json")
                def data = new groovy.json.JsonSlurper().parse(manifest)
                data.entrypoints['fabric-gametest'] = [
                    'com.nakami.mcheadfunction.HeadGameplayTest',
                    'com.nakami.mcheadfunction.FrogGameplayTest'
                ]
                manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
            }
        }
    }
}
