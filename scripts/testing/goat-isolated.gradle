// Keep diagnostics from replacing classes loaded by a running development client.
allprojects {
    layout.buildDirectory.set(file('build/goat-isolated'))
    afterEvaluate {
        tasks.named('processGametestResources').configure {
            doLast {
                def manifest = file("${destinationDir}/fabric.mod.json")
                def data = new groovy.json.JsonSlurper().parse(manifest)
                data.entrypoints['fabric-gametest'] = ['com.nakami.mcheadfunction.HeadDepthTest']
                manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
            }
        }
    }
}
