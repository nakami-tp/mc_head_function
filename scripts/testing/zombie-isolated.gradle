// Keep this run separate from other ongoing validation work.
allprojects {
    layout.buildDirectory.set(file('build/zombie-isolated'))
    afterEvaluate {
        tasks.named('processGametestResources').configure {
            doLast {
                def manifest = file("${destinationDir}/fabric.mod.json")
                def data = new groovy.json.JsonSlurper().parse(manifest)
                data.entrypoints['fabric-gametest'] = ['com.nakami.mcheadfunction.ZombieGameplayTest', 'com.nakami.mcheadfunction.HeadGameplayTest', 'com.nakami.mcheadfunction.BeheadingGameplayTest']
                manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
            }
        }
    }
}
allprojects {
    afterEvaluate {
        def validationRunDir = System.getenv('MC_HEAD_ZOMBIE_FRENZY_ONLY') == 'true'
            ? 'build/zombie-frenzy-validation' : 'build/zombie-client-validation'
        sourceSets {
            zombieValidation {
                compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
                runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
            }
        }
        loom {
            mods { zombie_client_validation { sourceSet sourceSets.zombieValidation } }
            runs {
                zombieValidation {
                    client()
                    source sourceSets.zombieValidation
                    runDir validationRunDir
                }
            }
        }
        tasks.named('runZombieValidation').configure {
            doFirst { project.delete project.file("${validationRunDir}/result.txt"), project.file("${validationRunDir}/screenshots") }
            doLast {
                def result = project.file("${validationRunDir}/result.txt")
                if (!result.exists() || !result.text.startsWith('PASS ')) {
                    throw new GradleException('Zombie client validation failed; see result.txt and logs.')
                }
            }
        }
    }
}
